<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Badge background: deep space indigo -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3730a3"/>
      <stop offset="0.42" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0a0618"/>
    </linearGradient>
    <!-- Accent: violet to fuchsia -->
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8b4fe"/>
      <stop offset="0.45" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <!-- Hot core for glow -->
    <radialGradient id="glow" cx="0.5" cy="0.44" r="0.62">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <!-- Glass top shine -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Wave stroke fade -->
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9d5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e9d5ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#e9d5ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Badge -->
  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#glow)"/>

  <!-- Sound-wave arcs behind the mark -->
  <g fill="none" stroke="url(#wave)" stroke-width="10" stroke-linecap="round" opacity="0.5">
    <path d="M150 320 A120 120 0 0 1 150 192"/>
    <path d="M112 356 A172 172 0 0 1 112 156"/>
    <path d="M362 320 A120 120 0 0 0 362 192"/>
    <path d="M400 356 A172 172 0 0 0 400 156"/>
  </g>

  <!-- W monogram with glow layer -->
  <g filter="url(#drop)">
    <path d="M112 158 L170 354 L256 208 L342 354 L400 158"
      fill="none" stroke="url(#acc)" stroke-width="54"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M112 158 L170 354 L256 208 L342 354 L400 158"
    fill="none" stroke="url(#acc)" stroke-width="54"
    stroke-linecap="round" stroke-linejoin="round" opacity="0.35" filter="url(#soft)"/>

  <!-- Play triangle in the W valley -->
  <g filter="url(#drop)">
    <path d="M231 268 L305 268 L268 322 Z" fill="#fdf7ff"/>
  </g>

  <!-- Equalizer ticks under the mark -->
  <g fill="url(#acc)" opacity="0.9">
    <rect x="196" y="386" width="14" height="42" rx="7"/>
    <rect x="224" y="372" width="14" height="56" rx="7"/>
    <rect x="252" y="392" width="14" height="36" rx="7"/>
    <rect x="280" y="366" width="14" height="62" rx="7"/>
    <rect x="308" y="384" width="14" height="44" rx="7"/>
  </g>

  <!-- Glass shine -->
  <path d="M16 134 C120 62 392 62 496 134 L496 118 C400 40 112 40 16 118 Z" fill="url(#glass)"/>
  <rect x="16" y="16" width="480" height="480" rx="118" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
</svg>
