appId: com.wick.dev.wickedplayer
productName: Wicked Player
copyright: Wicked Player 2026

directories:
  output: dist
  buildResources: .

npmRebuild: false

files:
  - main.js
  - preload.js
  - icon.png
  - node_modules/**/*

# Hosted-only app: no local backend and no .env are bundled.
extraResources:
  - from: ../wicked-frontend/dist
    to: app-ui
  - from: discord-app.json
    to: backend/data/discord-app.json

protocols:
  - name: Wicked Player
    schemes:
      - wicked

win:
  target:
    - nsis
  icon: icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  uninstallDisplayName: Wicked Player

publish:
  provider: github
  owner: Tone730
  repo: wicked-player
